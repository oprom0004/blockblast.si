<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast Puzzle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1423;
      touch-action: none;
      overscroll-behavior: none;
    }
    #unity-container {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #0f1423;
      touch-action: none;
      cursor: grab;
    }
    #unity-canvas:active {
      cursor: grabbing;
    }
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 242, 254, 0.2);
      border-top-color: #00f2fe;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loading-text {
      color: #00f2fe;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    #unity-progress-bar-empty {
      width: 160px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f2fe, #9d4edd);
      transition: width 0.2s ease;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div class="loading-spinner"></div>
      <div class="loading-text">LOADING BLOCK BLAST...</div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");

    // Prevent default touch dragging so all gesture movement goes directly into the canvas
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); }, { passive: false });

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/BlockBlast1.1-8.loader.js";
    const config = {
      dataUrl: buildUrl + "/BlockBlast1.1-8.data.unityweb",
      frameworkUrl: buildUrl + "/BlockBlast1.1-8.framework.js.unityweb",
      codeUrl: buildUrl + "/BlockBlast1.1-8.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "BlockBlast",
      productName: "Block Blast Web",
      productVersion: "1.1",
      showBanner: () => {}
    };

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then(() => {
        loadingBar.style.display = "none";
      }).catch((err) => {
        console.error(err);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
